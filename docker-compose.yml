services:
  wishlist:
    build: .
    image: christmas-wishlist:latest
    container_name: christmas-wishlist
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
    ports:
      # Only reachable from the VPS itself; put Caddy/nginx in front for HTTPS.
      - "127.0.0.1:3000:3000"
    volumes:
      - wishlist-data:/data

volumes:
  wishlist-data:
