<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f3d2e">
<title>Gift Planner · Wish Lists</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎄</text></svg>">
<link rel="preload" href="/static/fonts/nunito-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/static/fonts/mountains-of-christmas-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/festive.css">
<script>document.documentElement.dataset.theme = localStorage.getItem("wl_theme") || "classic";</script>
</head>
<body>
<header class="topbar"><nav class="wrap" data-nav><a class="brand" href="/">🎄 <span>Wish Lists</span></a></nav></header>
<main class="wrap">
  <h1 style="margin-top:20px">Gift Planner</h1>
  <p class="muted">Everything you've claimed, what you're spending, and what's still to wrap. Only you can see this.</p>

  <section class="panel">
    <div class="section-head" style="margin-top:0"><h3 style="margin:0">💰 Budget</h3><span id="budget-label" class="muted"></span></div>
    <div class="budget-bar" id="budget-bar"><span style="width:0"></span></div>
    <form class="inline-form" id="budget-form" style="max-width:340px">
      <input type="number" id="budget" min="0" step="1" inputmode="decimal" placeholder="Set a budget" aria-label="Budget">
      <button class="btn btn-sm" type="submit">Save</button>
    </form>
  </section>

  <section class="panel">
    <div class="section-head" style="margin-top:0"><h3 style="margin:0">🎁 Gifts I'm getting</h3><span class="muted small" id="wrap-count"></span></div>
    <div id="planner-items"></div>
  </section>

  <section class="panel">
    <h3>📜 Lists to shop from</h3>
    <div id="other-lists" class="row"></div>
  </section>
</main>
<script src="/static/common.js"></script>
<script src="/static/festive.js"></script>
<script src="/static/planner.js"></script>
</body>
</html>
