<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f3d2e">
<title>North Pole Access</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎄</text></svg>">
<link rel="preload" href="/static/fonts/nunito-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/static/fonts/mountains-of-christmas-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/festive.css">
<script>document.documentElement.dataset.theme = localStorage.getItem("wl_theme") || "classic";</script>
</head>
<body>
<header class="topbar"><nav class="wrap" data-nav><a class="brand" href="/">🎄 <span>Wish Lists</span></a></nav></header>
<main class="login-wrap" data-sky>
  <form class="login-card" id="login-form" autocomplete="on">
    <h1>North Pole Access</h1>
    <p class="muted" style="text-align:center;margin-top:0">Elves only beyond this point.</p>
    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" autocapitalize="none" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
    </div>
    <p class="error" id="login-error" role="alert"></p>
    <button class="btn btn-red" style="width:100%" type="submit">Enter the workshop</button>
  </form>
</main>
<script src="/static/common.js"></script>
<script src="/static/festive.js"></script>
<script src="/static/login.js"></script>
</body>
</html>
