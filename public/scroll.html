<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f3d2e">
<title>Santa's Scroll</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎄</text></svg>">
<link rel="preload" href="/static/fonts/nunito-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/static/fonts/mountains-of-christmas-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/festive.css">
<link rel="stylesheet" href="/static/extras.css">
<script>document.documentElement.dataset.theme = localStorage.getItem("wl_theme") || "classic";</script>
</head>
<body>
<header class="topbar"><nav class="wrap" data-nav><a class="brand" href="/">🎄 <span>Wish Lists</span></a></nav></header>
<main class="scroll-page">
  <div class="scroll-tools">
    <a class="btn btn-light btn-sm" id="back-link" href="/">← Back to the list</a>
    <button class="btn btn-red btn-sm" type="button" id="print-btn">🖨️ Print the scroll</button>
    <label class="hidden" id="unclaimed-wrap"><input type="checkbox" id="only-unclaimed"> Only unclaimed</label>
  </div>
  <article class="scroll" aria-live="polite">
    <div class="scroll-rod top" aria-hidden="true"></div>
    <div class="parchment" id="parchment"><p style="text-align:center">Unrolling the scroll…</p></div>
    <div class="scroll-rod bottom" aria-hidden="true"></div>
  </article>
</main>
<script src="/static/common.js"></script>
<script src="/static/festive.js"></script>
<script src="/static/scroll.js"></script>
</body>
</html>
