<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f3d2e">
<title>Account · Wish Lists</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎄</text></svg>">
<link rel="preload" href="/static/fonts/nunito-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/static/fonts/mountains-of-christmas-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/festive.css">
<script>document.documentElement.dataset.theme = localStorage.getItem("wl_theme") || "classic";</script>
</head>
<body>
<header class="topbar"><nav class="wrap" data-nav><a class="brand" href="/">🎄 <span>Wish Lists</span></a></nav></header>
<main class="wrap" style="max-width:640px">
  <h1 style="margin-top:20px">Account</h1>

  <form class="panel" id="profile-form">
    <h3>🎅 Profile</h3>
    <div class="field"><label for="display_name">Display name</label><input type="text" id="display_name" maxlength="60" required></div>
    <div class="field"><label for="intro">A note for gift-givers <span class="muted">(shown on your list)</span></label>
      <textarea id="intro" maxlength="500" placeholder="I'm a size M, love anything green, and no more mugs please!"></textarea></div>
    <div class="field">
      <label>Avatar</label>
      <div class="avatar-pick" id="avatar-pick"></div>
    </div>
    <div class="field">
      <label for="theme">Theme</label>
      <select id="theme">
        <option value="classic">❄️ Classic (snowy night)</option>
        <option value="fireplace">🔥 Fireplace (cozy dark)</option>
      </select>
    </div>
    <button class="btn" type="submit">Save profile</button>
  </form>

  <form class="panel" id="password-form">
    <h3>🔑 Change password</h3>
    <input type="text" autocomplete="username" id="pw-username" hidden>
    <div class="field"><label for="current_password">Current password</label><input type="password" id="current_password" autocomplete="current-password" required></div>
    <div class="field"><label for="new_password">New password <span class="muted">(8+ characters)</span></label><input type="password" id="new_password" autocomplete="new-password" minlength="8" required></div>
    <button class="btn btn-red" type="submit">Change password</button>
  </form>
</main>
<script src="/static/common.js"></script>
<script src="/static/festive.js"></script>
<script src="/static/account.js"></script>
</body>
</html>
